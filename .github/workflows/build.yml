name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 设置 gradlew 权限
        run: chmod +x gradlew

      - name: Gradle Build
        run: ./gradlew build

      - name: 上传 JAR 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ChickenDupe-build
          path: build/libs/*.jar

  upload:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: ChickenDupe-build

      - name: 上传最终产物（可选）
        uses: actions/upload-artifact@v4
        with:
          name: ChickenDupe
          path: '*.jar'
