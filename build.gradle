plugins {
    id 'java'
}

// ====== 版本文件自动迭代 ======
def versionFile = file('version.properties')
def versionProps = new Properties()

if (versionFile.exists()) {
    versionFile.withInputStream { versionProps.load(it) }
} else {
    versionProps.setProperty('version', '1.0.0')
}

// 解析当前版本号
def parts = versionProps.getProperty('version').tokenize('.')
def major = parts[0] as int
def minor = parts.size() > 1 ? (parts[1] as int) : 0
def patch = parts.size() > 2 ? (parts[2] as int) : 0

// 每次构建自动递增 patch
patch++
def nextVersion = "${major}.${minor}.${patch}"
versionProps.setProperty('version', nextVersion)
versionFile.withOutputStream { versionProps.store(it, 'Auto-incremented by build') }

group = 'com.zhouyi.mc3d3k'
version = nextVersion

// 输出文件名: ChickenDupe-x.x.x.jar
base {
    archivesName = 'ChickenDupe'
}

repositories {
    mavenCentral()
    maven {
        name = "papermc"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly "dev.folia:folia-api:[26.2.build,)"
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release = targetJavaVersion
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
